<div class="max-w-md mx-auto mt-10 p-10 bg-white rounded-lg shadow-md border border-gray-200">
  <h2 class="text-xl font-bold text-heading mb-4">Crear una cuenta</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 my-4">
    <div class="grid grid-cols-2 gap-4">
      <app-form-input
        label="Nombre (*)"
        type="text"
        [control]="registerForm.get('first_name')!"
        [errorMessages]="{
          required: 'El nombre es obligatorio',
        }"
      />

      <app-form-input
        label="Apellidos (*)"
        type="text"
        [control]="registerForm.get('last_name')!"
        [errorMessages]="{
          required: 'Los apellidos son obligatorios',
        }"
      />
    </div>

    <app-form-input
      label="Correo electrónico (*)"
      type="email"
      [control]="registerForm.get('email')!"
      [errorMessages]="{
        required: 'El email es obligatorio',
        email: 'Introduce un email válido',
      }"
    />

    <app-form-input
      label="Contraseña (*)"
      type="password"
      [control]="registerForm.get('password')!"
      [errorMessages]="{
        required: 'La contraseña es obligatoria',
        minlength: 'Mínimo 6 caracteres',
      }"
    />
    <app-form-input
      label="Confirmar contraseña (*)"
      type="password"
      [control]="registerForm.get('password_confirmation')!"
      [errorMessages]="{
        required: 'Confirma tu contraseña',
      }"
    />
    @if (
      registerForm.hasError('passwordMismatch') &&
      registerForm.get('password_confirmation')?.touched
    ) {
      <span class="form_error">Las contraseñas no coinciden</span>
    }

    @if (errorMessage) {
      <span class="form_error">{{ errorMessage }}</span>
    }

    <button type="submit" [disabled]="registerForm.invalid" class="form_button">Registrarse</button>

    <p class="text-sm text-center text-gray-600">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-blue-600 hover:underline cursor-pointer">Inicia sesión</a>
    </p>
  </form>
</div>
