@if (items.length > 0) {
  <section class="py-8" aria-label="Categorías destacadas">
    <h2 class="text-2xl font-black text-gray-800 mb-6 uppercase tracking-tight">
      Categorías que te pueden gustar
    </h2>
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
      @for (item of items; track item.category.id; let i = $index) {
        @let colors = getColors(item.color, i);
        <button
          (click)="navigateToCategory(item.category.id)"
          class="flex items-center gap-4 p-4 rounded-xl border hover:shadow-md transition-all duration-300 cursor-pointer"
          [class]="colors.borderColor + ' ' + colors.bgColor"
          [attr.aria-label]="'Ver productos de ' + item.category.name"
        >
          <div
            class="size-12 rounded-lg bg-white flex items-center justify-center shadow-sm"
            aria-hidden="true"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="size-6"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M5.25 2.25a3 3 0 0 0-3 3v4.318a3 3 0 0 0 .879 2.121l9.58 9.581c.92.92 2.39 1.186 3.548.428a18.849 18.849 0 0 0 5.441-5.44c.758-1.16.492-2.629-.428-3.548l-9.58-9.581a3 3 0 0 0-2.122-.879H5.25ZM6.375 7.5a1.125 1.125 0 1 0 0-2.25 1.125 1.125 0 0 0 0 2.25Z"
                clip-rule="evenodd"
              />
            </svg>
          </div>
          <span class="font-bold text-lg" [class]="colors.textColor">{{ item.category.name }}</span>
        </button>
      }
    </div>
  </section>
}
