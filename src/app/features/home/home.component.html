<app-hero-banner [banners]="homeBanners()"></app-hero-banner>

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
  <app-product-slider title="Novedades" [products]="latestProducts()" />

  @if (featuredCategory() && featuredProducts().length > 0) {
    <app-product-slider [title]="featuredCategory()!.name" [products]="featuredProducts()" />
  }

  <app-category-buttons [items]="categoryButtonItems()"></app-category-buttons>
</div>
