<button
  type="button"
  (click)="scrollToContent($event, 'admin-content')"
  class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-blue-600 focus:text-white focus:rounded-lg focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 cursor-pointer"
>
  Saltar al panel de administración
</button>
<div class="flex h-screen bg-gray-100">
  <app-sidebar [isOpen]="isSidebarOpen()" (onClose)="isSidebarOpen.set(false)" />

  <div class="flex-1 flex flex-col overflow-hidden md:ml-64">
    <header class="bg-white p-4 shadow-sm flex items-center gap-4" role="banner">
      <button
        type="button"
        (click)="isSidebarOpen.set(true)"
        class="md:hidden text-gray-600 border hover:bg-gray-100 rounded p-2"
        aria-label="Abrir menú lateral"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
      <h2 class="text-xl font-bold text-gray-800">Panel de Control</h2>
    </header>
    <main
      id="admin-content"
      class="flex-1 overflow-x-hidden overflow-y-auto p-2 md:p-6"
      tabindex="-1"
    >
      <router-outlet></router-outlet>
    </main>
  </div>
  <app-toast />
  <app-spinner />
</div>
