<div
  class="flex flex-col md:flex-row gap-4 mt-3 mb-6 items-stretch sm:items-center justify-between"
>
  <div class="relative flex-1 max-w-md">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
    </div>
    <input
      type="text"
      (input)="handleSearch($event)"
      [placeholder]="placeholder()"
      class="w-full p-2 pl-8 border rounded-lg focus:ring-blue-500 focus:border-blue-500"
    />
  </div>

  @if (buttonLabel()) {
    <button
      (click)="handleAdd()"
      class="inline-flex items-center justify-center px-6 py-2.5 border text-sm font-bold rounded-xl text-white bg-blue-600 hover:bg-blue-700 transition-all cursor-pointer"
    >
      + {{ buttonLabel() }}
    </button>
  }
</div>
