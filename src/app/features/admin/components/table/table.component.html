<div class="overflow-x-auto shadow-md rounded-lg border border-gray-200">
  <table class="min-w-full text-sm text-left text-gray-500 border-collapse">
    <thead class="text-xs text-gray-700 uppercase bg-gray-100 border-b border-gray-200">
      <tr>
        @for (col of columns; track col.key) {
          <th
            scope="col"
            class="px-6 py-3 border-r border-gray-200"
            [attr.aria-sort]="
              col.sortable
                ? sortColumn() === col.key
                  ? sortDirection() === 'asc'
                    ? 'ascending'
                    : 'descending'
                  : 'none'
                : null
            "
          >
            @if (col.sortable) {
              <button
                type="button"
                (click)="sort(col)"
                class="w-full flex items-center gap-1 font-bold tracking-wider text-left uppercase focus:outline-none focus:text-blue-600 hover:text-gray-900"
                [attr.aria-label]="'Ordenar por ' + col.header"
              >
                {{ col.header }}
                <span class="text-gray-400 text-xs" aria-hidden="true">
                  {{ getSortIcon(col.key) }}
                </span>
              </button>
            } @else {
              <span class="font-bold tracking-wider">{{ col.header }}</span>
            }
          </th>
        }
      </tr>
    </thead>
    <tbody>
      @if (sortedData().length > 0) {
        @for (row of sortedData(); track row.id) {
          <tr class="bg-white border-b border-gray-200 hover:bg-blue-50 transition-colors">
            <ng-container *ngTemplateOutlet="rowTemplate; context: { $implicit: row }" />
            @if (actionsTemplate) {
              <td class="px-6 py-4 whitespace-nowrap text-center">
                <div class="inline-flex items-center justify-center gap-4">
                  <ng-container *ngTemplateOutlet="actionsTemplate; context: { $implicit: row }" />
                </div>
              </td>
            }
          </tr>
        }
      } @else {
        <tr>
          <td [attr.colspan]="columns.length" class="text-center py-10 text-gray-400 bg-gray-50">
            {{ emptyMessage }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
