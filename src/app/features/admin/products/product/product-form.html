<div class="max-w-2xl mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <button
      (click)="goBack()"
      class="text-gray-500 hover:text-gray-700 cursor-pointer transition"
      aria-label="Volver al listado de productos"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-5"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
        />
      </svg>
    </button>
    <h2 class="text-xl font-semibold text-gray-800">
      {{ isEditMode ? 'Editar producto' : 'Nuevo producto' }}
    </h2>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <app-form-input
            id="name"
            label="Nombre (*)"
            type="text"
            placeholder="Nombre del producto"
            [attr.aria-required]="true"
            [control]="form.get('name')!"
            [errorMessages]="{
              required: 'El nombre es obligatorio',
            }"
          />
        </div>

        <div class="col-span-2">
          <app-form-textarea
            id="details"
            label="Detalles del producto"
            [rows]="5"
            placeholder="Breve resumen para el detalle del producto (máx. 500 caracteres)"
            [control]="form.get('details')!"
            [errorMessages]="{
              maxlength: 'El resumen no puede superar los 500 caracteres',
            }"
          />
        </div>

        <div class="col-span-2">
          <app-form-textarea
            id="description"
            label="Descripción completa (*)"
            [rows]="5"
            placeholder="Descripción extensa del producto"
            [control]="form.get('description')!"
            [attr.aria-required]="true"
            [errorMessages]="{
              required: 'La descripción es obligatoria',
            }"
          />
        </div>

        <div class="col-span-2 md:col-span-1">
          <app-form-select
            id="category_id"
            label="Categoría del producto (*)"
            [control]="form.get('category_id')!"
            [attr.aria-required]="true"
            [errorMessages]="{ required: 'Selecciona una categoría' }"
          >
            <option value="0" disabled>Selecciona una categoría</option>
            @for (category of categories(); track category.id) {
              <option [value]="category.id">{{ category.name }}</option>
            }
          </app-form-select>
        </div>

        <div class="col-span-2 md:col-span-1">
          <app-form-input
            id="price"
            label="Precio(€) (*)"
            type="number"
            placeholder="0.00"
            [control]="form.get('price')!"
            [attr.aria-required]="true"
            [errorMessages]="{
              required: 'El precio es obligatorio',
              min: 'Debe ser mayor o igual a 0',
            }"
          />
        </div>
        <div class="col-span-2 md:col-span-1">
          <app-form-input
            id="stock"
            label="Stock (*)"
            type="number"
            placeholder="0"
            [control]="form.get('stock')!"
            [attr.aria-required]="true"
            [errorMessages]="{
              required: 'El stock es obligatorio',
              min: 'Debe ser mayor o igual a 0',
            }"
          />
        </div>

        <div class="col-span-2 md:col-span-1">
          <app-form-input
            id="image"
            label="URL imagen"
            type="text"
            placeholder="https://..."
            [control]="form.get('image')!"
          />
        </div>

        <div class="col-span-2 flex items-center gap-3">
          <input
            formControlName="is_active"
            type="checkbox"
            id="is_active"
            class="w-4 h-4 text-blue-600 rounded border-gray-300 cursor-pointer"
          />
          <label for="is_active" class="form_label mb-0 cursor-pointer">Producto activo</label>
        </div>
      </div>

      <div class="flex flex-col md:flex-row md:justify-end gap-3 mt-2">
        <button type="submit" [disabled]="form.invalid" class="form_button">
          {{ isEditMode ? 'Guardar cambios' : 'Crear producto' }}
        </button>
        <button
          type="button"
          (click)="goBack()"
          class="px-4 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition cursor-pointer"
        >
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
