<div class="max-w-5xl mx-auto pb-10">
  <div class="flex items-center gap-3 mb-8">
    <button
      type="button"
      (click)="goBack()"
      class="text-gray-500 hover:text-gray-800 transition p-2 hover:bg-gray-100 rounded-full cursor-pointer"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
        />
      </svg>
    </button>
    <h2 class="text-2xl font-bold text-gray-800">Editar Usuario</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2 flex flex-col gap-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
        <h3 class="text-lg font-bold mb-5 text-gray-700">Información Personal</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <app-form-input
            id="first_name"
            label="Nombre (*)"
            type="text"
            [control]="form.get('first_name')!"
            [errorMessages]="{
              required: 'El nombre es obligatorio',
            }"
          />
          <app-form-input
            id="last_name"
            label="Apellido (*)"
            type="text"
            [control]="form.get('last_name')!"
            [errorMessages]="{
              required: 'El apellido es obligatorio',
            }"
          />

          <div class="md:col-span-2">
            <app-form-input
              id="email"
              label="Email (Solo lectura)"
              type="email"
              [control]="form.get('email')!"
            />
          </div>
          <div class="md:col-span-2">
            <app-form-input
              id="phone"
              label="Teléfono"
              type="text"
              [control]="form.get('phone')!"
            />
          </div>
        </div>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
        <h3 class="text-lg font-bold mb-5 text-gray-700">Dirección</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="md:col-span-2">
            <app-form-input id="street" label="Calle" type="text" [control]="form.get('street')!" />
          </div>
          <app-form-input id="city" label="Ciudad" type="text" [control]="form.get('city')!" />
          <app-form-input
            id="province"
            label="Provincia"
            type="text"
            [control]="form.get('province')!"
          />
          <app-form-input
            id="postal_code"
            label="Código Postal"
            type="text"
            [control]="form.get('postal_code')!"
          />
        </div>
      </div>
    </div>

    <div class="flex flex-col gap-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
        <h3 class="text-lg font-bold mb-5 text-gray-700">Ajustes</h3>
        <div class="mb-6">
          <app-form-select
            id="role"
            label="Rol"
            [control]="form.get('role')!"
            [errorMessages]="{ required: 'Selecciona un rol' }"
          >
            <option value="client">Cliente</option>
            <option value="admin">Administrador</option>
          </app-form-select>
        </div>

        <div class="flex items-center gap-3 p-4 bg-red-50 rounded-xl border border-red-100">
          <input
            formControlName="is_blocked"
            type="checkbox"
            id="is_blocked"
            class="w-5 h-5 text-red-600 rounded"
          />
          <label for="is_blocked" class="text-sm font-bold text-red-700 cursor-pointer"
            >Bloquear Cuenta</label
          >
        </div>
      </div>
    </div>
    <div class="flex flex-col gap-3">
      <button type="submit" [disabled]="form.invalid" class="form_button w-full py-4 font-bold">
        Guardar Cambios
      </button>
      <button type="button" (click)="goBack()" class="form_button-cancel w-full py-3">
        Cancelar
      </button>
    </div>
  </form>
</div>
