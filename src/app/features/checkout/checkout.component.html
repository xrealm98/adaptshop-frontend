<div class="max-w-5xl mx-auto p-6">
  <h1 class="text-3xl font-bold mb-8">Pago</h1>

  <form [formGroup]="form" (ngSubmit)="onPay()" class="grid md:grid-cols-2 gap-12">
    <div class="space-y-4 flex flex-col gap-2">
      <section aria-labelledby="shipping-heading" class="space-y-4 flex flex-col gap-2">
        <h2 class="text-xl font-semibold">Datos de envío</h2>

        <app-form-input
          id="Nombre"
          label="Nombre (*)"
          type="text"
          [control]="form.get('first_name')!"
          [errorMessages]="{
            required: 'El nombre es obligatorio',
          }"
        />

        <app-form-input
          id="last_name"
          label="Apellidos (*)"
          type="text"
          [control]="form.get('last_name')!"
          [errorMessages]="{
            required: 'Los apellidos son obligatorios',
          }"
        />

        <div class="flex flex-col gap-1">
          <label for="email" class="form_label">Correo electrónico</label>
          <input
            id="email"
            formControlName="email"
            readonly
            class="form_input bg-gray-100 cursor-not-allowed text-gray-400"
            aria-label="Correo electrónico (no editable)"
          />
        </div>

        <app-form-input
          id="shipping_street"
          label="Dirección (*)"
          [control]="form.get('shipping_street')!"
          [errorMessages]="{ required: 'La dirección es obligatoria' }"
        />

        <div class="flex flex-col md:grid grid-cols-2 gap-4">
          <app-form-input
            id="shipping_city"
            label="Ciudad (*)"
            [control]="form.get('shipping_city')!"
            [errorMessages]="{ required: 'La ciudad es obligatoria' }"
          />
          <app-form-input
            id="shipping_province"
            label="Provincia (*)"
            [control]="form.get('shipping_province')!"
            [errorMessages]="{ required: 'La provincia es obligatoria' }"
          />
        </div>

        <div class="flex flex-col md:grid grid-cols-2 gap-4">
          <app-form-input
            id="shipping_postal_code"
            label="Código Postal (*)"
            [control]="form.get('shipping_postal_code')!"
            [errorMessages]="{ required: 'El código postal es obligatorio' }"
          />
          <app-form-input
            id="shipping_country"
            label="País (*)"
            [control]="form.get('shipping_country')!"
            [errorMessages]="{ required: 'El país es obligatorio' }"
          />
        </div>

        <div class="mt-4">
          <label class="flex items-center cursor-pointer">
            <input
              type="checkbox"
              formControlName="save_data"
              class="w-5 h-5 accent-black rounded border-gray-300"
            />
            <span class="ml-3 text-sm text-gray-700">¿Deseas guardar los datos en tu perfil?</span>
          </label>
        </div>
      </section>

      <section aria-labelledby="payment-heading" class="mt-4">
        <h2 id="payment-heading" class="text-xl font-semibold">Método de pago</h2>

        <div class="space-y-3 mt-4 mb-0.5">
          <label
            class="flex items-center justify-between p-4 border border-gray-200 rounded-xl cursor-pointer bg-gray-50/50"
          >
            <span class="font-medium text-gray-800">Tarjeta de crédito o débito</span>
            <input
              type="radio"
              name="payment_method"
              checked
              class="w-5 h-5 accent-green-600 rounded-xl"
              aria-label="Pagar con Tarjeta mediante Stripe"
            />
          </label>
        </div>

        <div
          id="card-element"
          class="p-4 border rounded bg-white shadow-sm"
          role="region"
          aria-label="Formulario seguro de tarjeta bancaria"
        ></div>
      </section>
    </div>

    <aside aria-labelledby="summary-heading" class="flex flex-col">
      <div class="border p-6 rounded-lg">
        <h2 id="summary-heading" class="text-xl font-semibold mb-4">Resumen del pedido</h2>
        <div role="list" class="space-y-3">
          @for (item of cartService.cartItems(); track item.id) {
            <div role="listitem" class="flex justify-between text-sm text-gray-600 pb-2">
              <span class="font-medium"
                ><span class="sr-only">Cantidad: </span>{{ item.quantity }}x {{ item.name }}</span
              >
              <span class="font-bold text-gray-800">{{
                item.price! * item.quantity | currency: 'EUR'
              }}</span>
            </div>
          }
        </div>
        <div class="text-right text-lg font-bold mt-4 pt-4 border-t">
          <span aria-live="polite">Total: {{ cartService.totalPrice() | currency: 'EUR' }}</span>
        </div>
      </div>
    </aside>
    <div>
      <button
        type="submit"
        [disabled]="form.invalid"
        class="w-full md:mt-6 p-3 bg-green-600 text-white rounded font-bold cursor-pointer hover:bg-green-700"
      >
        PAGAR
      </button>
      <button
        type="button"
        (click)="goBack()"
        class="w-full mt-3 p-3 bg-gray-200 text-gray-800 rounded font-bold cursor-pointer hover:bg-gray-300"
      >
        Volver a la tienda
      </button>
    </div>
  </form>
</div>
