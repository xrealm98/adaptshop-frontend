<section class="info-container animate-fade-in" aria-labelledby="profile-main-heading">
  <div class="header-section flex justify-between items-center mb-10">
    <div>
      <h2 id="profile-main-heading" class="text-2xl font-black text-gray-800 tracking-tight">
        DATOS PERSONALES
      </h2>
    </div>

    <button
      (click)="toggleEdit()"
      type="button"
      class="flex items-center gap-2 px-4 py-2 rounded-xl border-2 transition-all font-bold text-sm cursor-pointer"
      [class.border-blue-600]="!isEditing()"
      [class.text-blue-600]="!isEditing()"
      [class.border-gray-200]="isEditing()"
      [class.text-gray-400]="isEditing()"
      [attr.aria-expanded]="isEditing()"
      [attr.aria-label]="isEditing() ? 'Cancelar edición del perfil' : 'Editar datos del perfil'"
    >
      @if (!isEditing()) {
        <svg
          class="size-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125"
          />
        </svg>
        <span>Editar Perfil</span>
      } @else {
        <span>Cancelar</span>
      }
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-8">
    <fieldset class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <legend class="sr-only">Información del perfil del usuario</legend>
      <app-form-input
        id="first_name"
        label="Nombre"
        [control]="form.get('first_name')!"
        [readonly]="!isEditing()"
        placeholder="Tu nombre"
        [errorMessages]="{ required: 'El nombre es obligatorio' }"
      />
      <app-form-input
        id="last_name"
        label="Apellido"
        [control]="form.get('last_name')!"
        [readonly]="!isEditing()"
        placeholder="Tu apellido"
        [errorMessages]="{ required: 'El apellido es obligatorio' }"
      />
      <app-form-input
        id="phone"
        label="Teléfono"
        [control]="form.get('phone')!"
        [readonly]="!isEditing()"
        placeholder="Tu teléfono"
      />

      <div class="input-group">
        <label class="form_label" for="email">Correo Electrónico</label>
        <div class="relative">
          <input
            formControlName="email"
            class="form_input bg-gray-50 border-gray-100 text-gray-400 cursor-not-allowed pl-10"
            aria-label="Correo electrónico (No modificable)"
          />
          <svg
            class="size-5 absolute left-3 top-3 text-gray-300"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"
            />
          </svg>
        </div>
      </div>
    </fieldset>

    <hr class="border-gray-100" />

    <section aria-labelledby="address-heading">
      <h3 class="text-lg font-bold text-gray-800 mb-6">Dirección de envío</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="input-group md:col-span-2">
          <app-form-input
            id="street"
            label="Calle y número"
            [control]="form.get('street')!"
            [readonly]="!isEditing()"
            placeholder="Ej. Calle Mayor 1, Puerta 2"
          />
        </div>

        <app-form-input
          id="province"
          label="Provincia"
          [control]="form.get('province')!"
          [readonly]="!isEditing()"
          placeholder="Provincia"
        />
        <app-form-input
          id="city"
          label="Ciudad"
          [control]="form.get('city')!"
          [readonly]="!isEditing()"
          placeholder="Ciudad"
        />
        <app-form-input
          id="country"
          label="País"
          [control]="form.get('country')!"
          [readonly]="!isEditing()"
          placeholder="País"
        />
        <app-form-input
          id="postal_code"
          label="Código Postal"
          [control]="form.get('postal_code')!"
          [readonly]="!isEditing()"
          placeholder="Código Postal"
        />
      </div>
    </section>
    <div class="sr-only" aria-live="polite">
      {{
        isEditing()
          ? 'El formulario está en modo edición.'
          : 'Modo edición cancelado, los campos vuelven a ser de solo lectura.'
      }}
    </div>

    @if (isEditing()) {
      <div class="pt-6 border-t border-gray-100 flex justify-end">
        <button
          type="submit"
          [disabled]="form.invalid"
          class="bg-blue-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all disabled:opacity-50 cursor-pointer"
        >
          Actualizar mis datos
        </button>
      </div>
    }
  </form>
</section>
