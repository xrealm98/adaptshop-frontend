<button
  type="button"
  (click)="scrollToContent($event, 'main-content')"
  class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-blue-600 focus:text-white focus:rounded-lg focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 cursor-pointer"
>
  Saltar al contenido principal
</button>
<div class="min-h-screen flex flex-col">
  <app-header></app-header>
  <main id="main-content" class="grow px-4 py-2 focus:outline-none" tabindex="-1">
    <router-outlet />
  </main>
  <app-footer></app-footer>
</div>
<app-toast />
<app-spinner />
